name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Java robot code ──────────────────────────────────────────────────────
  java:
    name: Java (JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

  # ── hubcounter Python ────────────────────────────────────────────────────
  python-hubcounter:
    name: Python hubcounter (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubcounter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: >
          pytest
          --cov=hub_counter
          --cov-fail-under=65
          --cov-report=xml
          --cov-report=term-missing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubcounter-coverage
          path: hubcounter/coverage.xml

  # ── northstar Python ─────────────────────────────────────────────────────
  python-northstar:
    name: Python northstar (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: northstar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        # Production requirements include platform-specific packages (pypylon,
        # pyobjc) that are macOS/ARM only; install only the testable subset.
        run: pip install -r requirements-dev.txt numpy robotpy-wpimath opencv-python
      - name: Run tests with coverage
        run: >
          pytest
          --cov=.
          --cov-fail-under=40
          --cov-report=xml
          --cov-report=term-missing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-coverage
          path: northstar/coverage.xml
