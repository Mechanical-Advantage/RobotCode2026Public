[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Add northstar root to sys.path so local modules (config/, pipeline/, etc.)
# are importable before test files run. importlib mode avoids auto-importing
# northstar/__init__.py which requires ntcore, pypylon, and other hardware libs
# not available in CI.
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = [
    # Hardware-bound workers — require live camera and ML accelerator
    "*/apriltag_worker.py",
    "*/objdetect_worker.py",
    # USB device enumeration via OS APIs
    "*/reenumerate/*",
    # macOS IOKit hardware control
    "*/ns-iokit-ctl/*",
    # Camera capture (Basler pypylon / AVFoundation)
    "*/pipeline/Capture.py",
    # Object detection (CoreML/ONNX inference on live frames)
    "*/pipeline/ObjectDetector.py",
    # NT/stream output — integration tested only
    "*/output/OutputPublisher.py",
    "*/output/StreamServer.py",
    "*/output/VideoWriter.py",
]
