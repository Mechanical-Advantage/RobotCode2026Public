
syntax = "proto3";

package idun.proto;

option java_package = "org.littletonrobotics.idun";

message IOData {
  repeated double double = 1;
  repeated bool boolean = 2;
  repeated bytes raw = 3;
  repeated uint32 enum = 4;
}

// Inputs

message JoystickInputs {
  string name = 1;
  int32 type = 2;
  int32 axisCount = 3;
  repeated int32 axisType = 4;
  repeated double axisValue = 5;
  int32 buttonCount = 6;
  int32 buttons = 7;
  int32 povCount = 8;
  repeated int32 povValue = 9;
  bool isXbox = 10;
}

message ControlWord {
  bool enabled = 1;
  bool autonomous = 2;
  bool test = 3;
  bool estop = 4;
  bool fmsAttached = 5;
  bool dsAttached = 6;
}

message DSInputs {
  int32 allianceStation = 1;
  string eventName = 2;
  string gameSpecificMessage = 3;
  int32 matchNumber = 4;
  int32 replayNumber = 5;
  int32 matchType = 6;
  double matchTime = 7;
  ControlWord controlWord = 8;
  repeated JoystickInputs joystick = 9;
}

message RailStatus {
  double voltage = 1;
  double current = 2;
  bool active = 3;
  int64 currentFaults = 4;
}

message CANStatus {
  double utilization = 1;
  int64 offCount = 2;
  int64 txFullCount = 3;
  int64 receiveErrorCount = 4;
  int64 transmitErrorCount = 5;
}

message RIOInputs {
  bool systemActive = 1;
  bool brownedOut = 2;
  int64 commsDisableCount = 3;
  bool rslState = 4;
  double batteryVoltage = 5;
  double batteryCurrent = 6;
  RailStatus rail3v3 = 7;
  RailStatus rail5v = 8;
  RailStatus rail6v = 9;
  map<string, CANStatus> canStatus = 10;
  int64 epochTimeMicros = 11;
}

message TracerData {
  double inputCycleMs = 1;
  double dsAlertMs = 2;
  double disconnectedStopMs = 3;
  double phoenixRefreshMs = 4;
  double subsystemInputsMs = 5;
  double localDriveMs = 6;
  double builtInInputsMs = 7;
  double serializeMs = 8;
  double transmitMs = 9;
  double outputCycleMs = 10;
}

message RobotInputs {
  int64 buildUID = 1;
  int64 launchUID = 2;
  int64 seqnum = 3;
  DSInputs ds = 4;
  RIOInputs rio = 5;
  TracerData tracer = 6;
  bool isLocalDrive = 7;
  map<string, IOData> subsystem = 8;
}

// Outputs

message JoystickOutputs {
  int64 outputs = 1;
  int32 leftRumble = 2;
  int32 rightRumble = 3;
}

message RobotOutputs {
  int64 buildUID = 1;
  int64 launchUID = 2;
  int64 seqnum = 3;
  map<string, IOData> subsystem = 4;
  repeated JoystickOutputs joystick = 5;
  bool restartFlag = 6;
  double gyroOffset = 7;
}